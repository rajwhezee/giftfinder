name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest

    env:
      # `next build` DOES contact the database. It statically generates the 35
      # occasion pages from real gifts, and the landing page counts the
      # catalogue for its "over N gifts across N brands" line. Both run at build
      # time, so a placeholder connection string fails the build with
      # "Error occurred prerendering page" rather than anything about Postgres.
      #
      # Set this in the repo: Settings -> Secrets and variables -> Actions ->
      # New repository secret, named DATABASE_URL. Use the Neon pooled string.
      # The build only reads, so a read-only Neon role is the safer credential.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Without this the build dies at "Error occurred prerendering page /",
      # which says nothing about the missing credential that actually caused it.
      - name: Check DATABASE_URL is set
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set. Add it under Settings -> Secrets and variables -> Actions. The build prerenders pages from the database and cannot run without it."
            exit 1
          fi

      # `npm ci` triggers the postinstall `prisma generate`.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
