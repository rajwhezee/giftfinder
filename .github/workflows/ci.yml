name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest

    env:
      # No database is contacted during `next build` — only the /api/recommend
      # route touches Prisma, and that runs at request time. This placeholder
      # exists so `prisma generate` and any dotenv loading don't fail.
      DATABASE_URL: postgresql://user:password@localhost:5432/placeholder?sslmode=require

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` triggers the postinstall `prisma generate`.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
